# Build nativo linux/arm64 (sin QEMU) → GHCR
# Runner: ubuntu-24.04-arm (GitHub-hosted, ~16 GB RAM)
#
# Uso en el fork:
#   1. Copia este archivo a .github/workflows/build-arm64.yml
#   2. Desactiva workflows upstream que no aplican (deploy Dokploy self-hosted)
#   3. Actions → Build arm64 (Pi) → Run workflow
#   4. En Pi: ~/coach-watts/scripts/deploy-from-ghcr.sh <tag>

name: Build arm64 (Pi)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag extra de imagen (además de sha / latest-arm64)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Docker linux/arm64
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=sha,prefix=sha-
            type=raw,value=latest-arm64,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.pi
          platforms: linux/arm64
          push: true
          provenance: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Summary
        run: |
          {
            echo "## Imagen arm64"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "En la Pi:"
            echo '```bash'
            echo "IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA} \\"
            echo "  ~/coach-watts/scripts/deploy-from-ghcr.sh"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
